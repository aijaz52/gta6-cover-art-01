<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline' 'self'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Vice Cover Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%23ffac82'/%3E%3Cpath d='M6 9h7l5 18 5-18h7L21 33h-6zm26 0h3v24h-3z' fill='%231c1421'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="monogram" aria-hidden="true">VC</span><h1>Vice Cover Studio</h1></div>
    <span class="local"><span aria-hidden="true"></span> LOCAL WORKSPACE</span>
  </header>
  <main class="studio">
    <section class="stage" aria-labelledby="preview-title">
      <header class="stage-head"><h2 id="preview-title">Cover preview</h2><span class="spec">4:5 / PORTRAIT</span></header>
      <div class="proof"><canvas id="preview" width="960" height="1200" role="img" aria-label="Illustrated cover: Vice After Dark">Your browser needs canvas support.</canvas></div>
      <div class="stage-foot"><span>VICE CITY / ART DEPT.</span><span id="proof-spec">960 × 1200 PX</span></div>
    </section>
    <section class="controls" aria-labelledby="edit-title">
      <header class="control-head"><div><span class="kicker">COVER EDITOR</span><h2 id="edit-title">The edit</h2></div><button id="reset" type="button" class="icon-button" aria-label="Reset editor" title="Reset editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 1 3 6.7M3 12V5m0 7h7"/></svg></button></header>
      <section class="control-block" aria-labelledby="photo-title">
        <div class="field-head"><h3 id="photo-title"><span>01</span> Photo</h3><button id="demo" type="button" class="text-button" disabled>Use demo</button></div>
        <div class="drop" id="drop">
          <input type="file" id="photo" accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/bmp" aria-label="Choose a photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16l5-5 4 4 3-3 6 6M3 5h18v14H3z"/><circle cx="16" cy="9" r="1"/></svg>
          <div><strong id="photo-name">Choose or drop a photo</strong><small>JPG, PNG, WEBP / UP TO 25 MB</small></div>
        </div>
        <div class="zoom" id="zoom-row" hidden><label for="zoom">Crop zoom</label><input id="zoom" type="range" min="1" max="2" step="0.05" value="1"><output id="zoom-value" for="zoom">1.00×</output></div>
      </section>
      <section class="control-block">
        <div class="field-head"><h3><label for="caption"><span>02</span> Caption</label></h3><span id="count">15 / 64</span></div>
        <input id="caption" type="text" value="VICE AFTER DARK" maxlength="64" placeholder="Title your cover" autocomplete="off" spellcheck="false">
      </section>
      <fieldset class="control-block">
        <legend><span>03</span> Layout</legend>
        <div class="segments">
          <label><input type="radio" name="layout" value="skyline" checked><span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 3h26v26H3zM3 11l14 2 12-1M3 22l26-2M20 3l-3 10m-3 8 2 8"/></svg> Skyline</span></label>
          <label><input type="radio" name="layout" value="crossfire"><span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 3h26v26H3zM3 12l26-3M3 20l26 3M13 11l5 11-4 7"/></svg> Crossfire</span></label>
          <label><input type="radio" name="layout" value="strip"><span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 3h26v26H3zM3 10l26-3M3 17l26 3M3 25l26-2M15 9l4 10"/></svg> Strip</span></label>
        </div>
      </fieldset>
      <fieldset class="control-block">
        <legend><span>04</span> Color grade</legend>
        <div class="segments grades">
          <label><input type="radio" name="palette" value="sunset" checked><span><i class="swatch sunset"></i> Sunset</span></label>
          <label><input type="radio" name="palette" value="lagoon"><span><i class="swatch lagoon"></i> Lagoon</span></label>
          <label><input type="radio" name="palette" value="nocturne"><span><i class="swatch nocturne"></i> Night</span></label>
        </div>
      </fieldset>
      <div class="export">
        <label class="size-label" for="size">PNG SIZE</label>
        <select id="size"><option value="1">960 × 1200 px</option><option value="2" selected>1920 × 2400 px</option><option value="3">2880 × 3600 px</option></select>
        <button class="primary" type="button" id="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg> Download PNG</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
